# Pre-commit hooks configuration
# Install: pre-commit install
# Install pre-push tests: pre-commit install --hook-type pre-push
# Run manually: pre-commit run --all-files
# Run pre-push hooks manually: pre-commit run --hook-stage pre-push --all-files

# Hooks with no explicit `stages:` only run at commit time. Without this,
# every hook below (ruff/mypy/bandit/gitleaks/basic checks) would also
# redundantly re-run at push time on files that already passed at commit
# time — pytest-fast is the only hook meant to run on push, and it already
# declares its own `stages: [pre-push]`.
default_stages: [pre-commit]

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      # Linter
      - id: ruff
        args: [--fix]
      # Formatter
      - id: ruff-format

  # MyPy - Static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]
        args: [--ignore-missing-imports, --no-strict-optional]
        exclude: ^tests/

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]

  # Secrets scanning — catches API keys, OAuth tokens, AWS creds, etc.
  # before they enter git history. The pre-existing detect-private-key
  # hook only matches SSH keys; gitleaks covers the wider secret surface
  # that security.yml's TruffleHog currently scans post-push on CI.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  # Basic checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: trailing-whitespace
      - id: end-of-file-fixer

  # Conventional commits validation
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Local verification gate as a pre-push check. We run CI locally instead
  # of on GitHub Actions, so this is the real gate before code leaves the
  # machine. `--quick` = ruff check + ruff format --check + mypy + the
  # curated fast test subset (services/db/config/llm_providers, -n auto,
  # no coverage), ~30-60s. Run the FULL gate (adds bandit + the whole test
  # suite + package build) manually before a PR: `scripts/verify.ps1`.
  # verify.py is a stdlib launcher that resolves the project venv, so it
  # works whether or not a venv is active on PATH.
  - repo: local
    hooks:
      - id: verify-quick
        name: local verification gate (quick) on push
        entry: python scripts/verify.py --quick
        language: system
        pass_filenames: false
        stages: [pre-push]
        verbose: true
