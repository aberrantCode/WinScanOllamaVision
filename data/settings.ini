[LLMProvider]
active_provider = ollama
default_model =

[Ollama]
model = qwen2.5vl:latest
base_url = http://localhost:11434
timeout = 300

[ClaudeCLI]
command_template = claude --model %%MODEL%% --image %%IMAGE_PATHS%% --prompt %%PROMPT%%
timeout = 300
models = claude-3-5-sonnet-20241022,claude-3-5-haiku-20241022
default_model = claude-3-5-sonnet-20241022

[GeminiCLI]
command_template = gemini --model %%MODEL%% --image %%IMAGE_PATHS%% --prompt %%PROMPT%%
timeout = 300
models = gemini-2.0-flash-exp,gemini-1.5-pro
default_model = gemini-2.0-flash-exp

[DocumentProcessing]
scan_folder = C:\Users\erik.OPBTA\Pictures\Scans
organized_subfolder = ORGANIZED
title_keywords = Invoice, Statement, Bill, Receipt, Report, Contract, Agreement
auto_approval = false

[SourceDirectories]
directories = ["C:\\Users\\erik.OPBTA\\Pictures\\Scans"]
scan_on_startup = true

[AutoAnalysis]
enabled = true
incremental = true
batch_size = 10

[Theme]
theme = light
default_zoom_mode_png = fit_to_width
default_zoom_mode_pdf = fit_to_width
default_zoom_percent_png = 100
default_zoom_percent_pdf = 100

[OutputDirectory]
strategy = same_as_source
subdirectory_name = ORGANIZED
global_custom_path =

[SystemTray]
minimize_to_tray = false
close_to_tray = false

[AuditTrail]
enabled = false

[GUI]
app_name = WinScanLLM
window_width = 1024
window_height = 768
auto_start_analysis = false
confirm_before_exit = true

[AutoApproval]
enable_automatic_approvals = false
automatic_approval_delay = 10

[Prompts]
document_pages = You are an expert document analyst. Examine the provided images and determine which pages belong to the same continuous physical document.

The first image should ALWAYS be considered as belonging to the document (it's the anchor page). Analyze each subsequent page to determine if it belongs with the first page or not.

Respond ONLY with valid JSON in this format:
{
	"all_belong": boolean,
	"doc_page_count": integer,
	"do_not_belong": [array of integers]
}

Where:
- **all_belong**: true if all provided pages belong together, false if any page doesn't belong
- **doc_page_count**: number of pages that belong together (including the first page)
- **do_not_belong**: array of page indices (1-based) that don't belong. The first page (index 1) should NEVER be in this array.

Examples:

If all 3 pages belong together:
{ "all_belong": true, "doc_page_count": 3, "do_not_belong": [] }

If 3 pages provided and page 2 doesn't belong:
{ "all_belong": false, "doc_page_count": 2, "do_not_belong": [2] }

If 5 pages provided and pages 3 and 5 don't belong:
{ "all_belong": false, "doc_page_count": 3, "do_not_belong": [3, 5] }

document_metadata = Analyze this document page and extract the following information in JSON format:

Required fields:
1. **document_type**: Type of document (invoice, receipt, contract, letter, etc.)
2. **company**: Company name that issued this document
3. **document_date**: Date on the document (YYYY-MM-DD format if possible)
4. **tax_related**: Is this document related to taxes? (true/false) Examples include: W-2, 1099, tax returns, property tax bills, tax receipts, IRS correspondence, deductible expense receipts
5. **page_number**: Current page number (if visible)
6. **total_pages**: Total number of pages (if visible)
7. **rotation_needed** (boolean): Do the words in the text get read from left-to-right without having to flip it? If so then no rotation is needed (false); otherwise rotation is needed (true).
8. **suggested_rotation** (integer): If rotation needed, specify degrees clockwise: 90, 180, or 270. Use 0 if no rotation needed.
9. **rotation_confidence** (string): Confidence in rotation assessment: "high", "medium", or "low".
10. **confidence_score**: Your overall confidence in the extraction (0.0 to 1.0)

IMPORTANT: For rotation fields, carefully check if text can be read normally (left-to-right, top-to-bottom) without rotating the page. If you need to tilt your head to read it, mark rotation_needed as true and specify the degrees needed.

Return ONLY valid JSON with these exact field names.
