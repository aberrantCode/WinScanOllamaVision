[Version]
schema_version = 1.0.0
last_updated = 2026-02-10

[Ollama]
model = qwen3-vl:latest
base_url = http://localhost:11434
timeout_seconds = 60
use_local = true

[DocumentProcessing]
scan_folder = C:\Users\erik.OPBTA\Pictures\Scans
organized_subfolder = ORGANIZED
title_keywords = Invoice, Statement, Bill, Receipt, Report, Contract, Agreement
file_extensions = .pdf, .tif, .tiff, .jpg, .jpeg, .png
recursive_scan = true
max_pages_per_doc = 100

[GUI]
window_width = 1024
window_height = 768
app_name = WinScanLLM
theme = light
remember_window_position = true

[AutoApproval]
enable_automatic_approvals = false
automatic_approval_delay = 10
max_auto_approvals_per_day = 50

[Prompts]
document_pages = You are an expert document analyst. Examine the provided images. Determine if all pages belong to the *same continuous physical document*. Respond ONLY with 'YES' if all pages are from the same document, or 'NO' if they are not. Do not add any other text or explanation.
document_metadata = You are an expert at extracting key information from scanned documents.
Analyze the provided images to identify the following:
1. Source Company: The name of the organization that issued the document. Look at headers, footers, logos, or return addresses.
2. Document Title: The main purpose or type of the document (e.g., Invoice, Statement, Bill, Receipt, Report, Contract, Agreement).
3. Relevant Date: The primary date associated with the document (e.g., issue date, statement date, invoice date, contract date). Prioritize the most prominent and relevant date.
Respond ONLY in JSON format. Your JSON should contain three keys: 'company', 'title', and 'date'.
If any information cannot be found, use null for its value.
Example: { "company": "Acme Corp", "title": "Invoice", "date": "2023-10-26" }

[Logging]
level = INFO
log_file = logs/app.log
max_log_size_mb = 10

[Storage]
data_folder = data
db_path = data/metadata.db
backup_enabled = true
backup_folder = backups

[OCR]
engine = tesseract
language = eng
dpi_threshold = 300
use_orientation_detection = true

[Security]
enable_encryption = false
encryption_key_path =
allowed_hosts = localhost, 127.0.0.1

[Integration]
email_notifications = false
smtp_server =
smtp_port = 587
notify_on_error = true
