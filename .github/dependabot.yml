version: 2
updates:
  # Enable version updates for Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    # Integration branch — feature/dep PRs target dev, never main directly
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "aberrantCode"
    assignees:
      - "aberrantCode"
    # Group dependency updates
    groups:
      pytest-group:
        patterns:
          - "pytest*"
      pyqt-group:
        patterns:
          - "PyQt*"
          - "pyqt*"
      dev-dependencies:
        dependency-type: "development"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    # Integration branch — feature/dep PRs target dev, never main directly
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
