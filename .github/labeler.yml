# Auto-labeling rules for pull requests

"area:ui":
  - changed-files:
      - any-glob-to-any-file: "src/ui/**/*"

"area:database":
  - changed-files:
      - any-glob-to-any-file: "src/db/**/*"

"area:services":
  - changed-files:
      - any-glob-to-any-file: "src/services/**/*"

"area:config":
  - changed-files:
      - any-glob-to-any-file: "src/config/**/*"

"area:providers":
  - changed-files:
      - any-glob-to-any-file: "src/llm_providers/**/*"

"area:tests":
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**/*"
          - "conftest.py"

"area:ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**/*"
          - ".pre-commit-config.yaml"

"area:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**/*"
          - "*.md"
          - "CLAUDE.md"

"type:documentation":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**/*"

"type:dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - "requirements.txt"
          - "pyproject.toml"
          - "setup.py"

"type:tests":
  - changed-files:
      - any-glob-to-any-file: "tests/**/*"

"priority:high":
  - head-branch: ["^hotfix/", "^fix/critical"]

"status:needs-review":
  - changed-files:
      - any-glob-to-any-file: "src/**/*"
