name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log "$PREV_TAG..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          fi
          {
            echo "CHANGELOG<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Changes in this Release

            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation

            Download `WinScanLLM-Setup-${{ github.ref_name }}.exe` below and run it.
            SmartScreen may warn on first run — click **More info** → **Run anyway**.

            ## Verify (optional)

            ```powershell
            Get-FileHash .\WinScanLLM-Setup-${{ github.ref_name }}.exe -Algorithm SHA256
            ```
            Compare against `.sha256` attached to this release.
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

  build-windows-installer:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: create-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Write version file
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          Set-Content -Path src/__version__.py -Value "__version__ = `"$ver`"`n" -Encoding UTF8
          Write-Host "Version: $ver"

      - name: Build PyInstaller bundle
        shell: pwsh
        run: pyinstaller installer/WinScanLLM.spec

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 not found on runner" }
          & $iscc "/DAppVersion=$ver" "installer\WinScanLLM.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer/Output/WinScanLLM-Setup-*.exe | Select-Object -First 1
          $hash = Get-FileHash $exe.FullName -Algorithm SHA256
          $line = "$($hash.Hash.ToLower())  $($exe.Name)"
          $sidecar = "$($exe.FullName).sha256"
          Set-Content -Path $sidecar -Value $line -Encoding ASCII
          Write-Host "SHA-256: $line"

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/WinScanLLM-Setup-*.exe
            installer/Output/WinScanLLM-Setup-*.exe.sha256

  smoke-test-installer:
    name: Silent Install/Uninstall Smoke Test
    runs-on: windows-latest
    needs: build-windows-installer
    steps:
      - name: Download installer from release
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/WinScanLLM-Setup-$ver.exe"
          Invoke-WebRequest -Uri $url -OutFile "Setup.exe"
          Write-Host "Downloaded: $((Get-Item Setup.exe).Length) bytes"

      - name: Silent install
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath .\Setup.exe `
            -ArgumentList "/VERYSILENT", "/NORESTART", "/LOG=install.log"
          Write-Host "Install complete"

      - name: Assert install layout
        shell: pwsh
        run: |
          $exe = "C:\Program Files\WinScanLLM\WinScanLLM.exe"
          $unins = "C:\Program Files\WinScanLLM\unins000.exe"
          if (-not (Test-Path $exe))   { throw "Missing $exe" }
          if (-not (Test-Path $unins)) { throw "Missing $unins" }
          Write-Host "Layout OK"

      - name: Silent uninstall
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath "C:\Program Files\WinScanLLM\unins000.exe" `
            -ArgumentList "/VERYSILENT"

      - name: Assert clean uninstall
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\WinScanLLM") {
            throw "Install directory still present after uninstall"
          }
          Write-Host "Uninstall OK"

      - name: Upload install log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-log
          path: install.log
