name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  pr-validation:
    name: Validate PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[A-Z].+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            starts with an uppercase character.

      - name: Check for breaking changes
        run: |
          if git log --format=%B origin/${{ github.base_ref }}..${{ github.sha }} | grep -q "BREAKING CHANGE:"; then
            echo "⚠️ This PR contains breaking changes"
            echo "breaking_change=true" >> $GITHUB_OUTPUT
          fi

      - name: Check PR size
        run: |
          LINES_CHANGED=$(git diff --shortstat origin/${{ github.base_ref }}..HEAD | awk '{print $4+$6}')
          echo "Lines changed: $LINES_CHANGED"

          if [ "$LINES_CHANGED" -gt 1000 ]; then
            echo "::warning::This PR is quite large ($LINES_CHANGED lines). Consider splitting it into smaller PRs."
          fi

      - name: Label PR by size
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: "size/xs"
          xs_max_size: 10
          s_label: "size/s"
          s_max_size: 100
          m_label: "size/m"
          m_max_size: 500
          l_label: "size/l"
          l_max_size: 1000
          xl_label: "size/xl"

      - name: Auto-label by files
        uses: actions/labeler@v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

  test-status:
    name: Test Status Check
    runs-on: ubuntu-latest
    needs: []  # Will wait for test job from ci.yml
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Waiting for test job completion..."
          # This job serves as a required status check

  coverage-check:
    name: Coverage Requirement
    runs-on: ubuntu-latest
    needs: []  # Will wait for coverage job from ci.yml
    if: always()

    steps:
      - name: Check coverage
        run: |
          echo "Coverage requirement: 90%"
          # This job serves as a required status check
